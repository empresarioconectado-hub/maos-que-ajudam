openapi: 3.0.3
info:
  title: API Mãos que Ajudam
  version: 1.0.0
  description: >
    Contrato OpenAPI reconstruído a partir da implementação atual da Atividade 2
    (PIE II). O contrato original do PIE I não foi localizado no repositório;
    revise nomes e formatos caso exista uma versão anterior oficial.
servers:
  - url: http://localhost:3000
    description: Ambiente local
tags:
  - name: Autenticação
  - name: Saúde
  - name: Doadores
  - name: Itens
  - name: Doações
  - name: Estoque
  - name: Relatórios
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      security: []
      tags: [Autenticação]
      summary: Autentica uma conta e emite token Bearer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          description: Muitas tentativas de login
  /api/auth/me:
    get:
      tags: [Autenticação]
      summary: Retorna os dados da conta autenticada
      responses:
        '200':
          description: Conta autenticada
        '401':
          $ref: '#/components/responses/NaoAutorizado'
  /api/health/live:
    get:
      security: []
      tags: [Saúde]
      summary: Verifica se o processo HTTP está ativo
      responses:
        '200':
          description: Processo ativo
  /api/health/ready:
    get:
      security: []
      tags: [Saúde]
      summary: Verifica se o banco está disponível
      responses:
        '200':
          description: Banco disponível
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/health:
    get:
      security: []
      tags: [Saúde]
      summary: Verifica a API e a conexão com o banco
      responses:
        '200':
          description: API e banco disponíveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
                  timestamp: { type: string, format: date-time }
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/doadores:
    get:
      tags: [Doadores]
      summary: Lista doadores; aceita pesquisa e paginação opcionais
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: q
          in: query
          required: false
          description: Pesquisa parcial por nome, e-mail ou telefone
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Lista de doadores
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Doador' }
                  - $ref: '#/components/schemas/ListaPaginadaDoadores'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Doadores]
      summary: Cadastra um doador
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoDoador' }
      responses:
        '201':
          description: Doador criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doador' }
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '409':
          description: E-mail ou registro duplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/doadores/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Doadores]
      summary: Consulta um doador pelo identificador
      responses:
        '200':
          description: Doador encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doador' }
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Doadores]
      summary: Atualiza os dados de um doador
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoDoador' }
      responses:
        '200':
          description: Doador atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doador' }
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: E-mail ou registro duplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Doadores]
      summary: Exclui um doador sem registros vinculados
      responses:
        '204':
          description: Doador excluído sem corpo de resposta
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Exclusão bloqueada por doações vinculadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/itens:
    get:
      tags: [Itens]
      summary: Lista o catálogo de itens e suas categorias
      responses:
        '200':
          description: Catálogo de itens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemCatalogo' }
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/doacoes/{id}/status:
    patch:
      tags: [Doações]
      summary: Atualiza o estado operacional de uma doação
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [recebida, distribuida, cancelada]
              required: [status]
      responses:
        '200':
          description: Status atualizado e estoque sincronizado
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Transição inválida ou saldo insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/estoque:
    get:
      tags: [Estoque]
      summary: Lista saldos atuais por item
      responses:
        '200':
          description: Saldos atuais
  /api/estoque/movimentacoes:
    get:
      tags: [Estoque]
      summary: Lista movimentações recentes
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Histórico de movimentações
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
    post:
      tags: [Estoque]
      summary: Registra ajuste manual de estoque (administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoAjusteEstoque' }
      responses:
        '201':
          description: Ajuste registrado
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          description: Estoque insuficiente ou limite excedido
  /api/estoque/{id}/limite-minimo:
    patch:
      tags: [Estoque]
      summary: Configura limite mínimo e alerta (administrador)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LimiteMinimo' }
      responses:
        '200':
          description: Limite atualizado
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /api/relatorios/resumo:
    get:
      tags: [Relatórios]
      summary: Retorna indicadores operacionais
      responses:
        '200':
          description: Indicadores gerais
  /api/relatorios/doacoes.csv:
    get:
      tags: [Relatórios]
      summary: Exporta doações em CSV
      responses:
        '200':
          description: Arquivo CSV
          content:
            text/csv:
              schema: { type: string }
  /api/doacoes:
    get:
      tags: [Doações]
      summary: Lista doações com doador e itens agrupados
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Lista de doações
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/DoacaoDetalhada' }
                  - $ref: '#/components/schemas/ListaPaginadaDoacoes'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Doações]
      summary: Registra uma doação e seus itens em transação única
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaDoacao' }
      responses:
        '201':
          description: Doação registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem: { type: string, example: Doação registrada com sucesso }
                  id_doacao: { type: integer, example: 12 }
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador inteiro positivo do doador
      schema:
        type: integer
        minimum: 1
  schemas:
    NovoAjusteEstoque:
      type: object
      properties:
        id_item: { type: integer, minimum: 1 }
        tipo: { type: string, enum: [entrada, saida] }
        quantidade: { type: integer, minimum: 1 }
        observacao: { type: string, nullable: true, maxLength: 255 }
      required: [id_item, tipo, quantidade]
    LimiteMinimo:
      type: object
      properties:
        quantidade_minima: { type: integer, minimum: 0 }
      required: [quantidade_minima]
    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 100 }
        senha: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      required: [email, senha]
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        tipo: { type: string, example: Bearer }
        expira_em: { type: integer, example: 28800 }
        usuario:
          type: object
          properties:
            id_usuario: { type: integer }
            nome: { type: string }
            email: { type: string, format: email }
            perfil: { type: string, enum: [administrador, operador] }
          required: [id_usuario, nome, email, perfil]
      required: [token, tipo, expira_em, usuario]
    Erro:
      type: object
      properties:
        erro: { type: string, example: Requisição inválida }
        requestId: { type: string, format: uuid }
      required: [erro]
    ListaPaginadaDoacoes:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DoacaoDetalhada' }
        pagination:
          type: object
          properties:
            page: { type: integer, minimum: 1 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
          required: [page, limit, total, totalPages]
      required: [data, pagination]
    ListaPaginadaDoadores:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Doador' }
        pagination:
          type: object
          properties:
            page: { type: integer, minimum: 1 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
          required: [page, limit, total, totalPages]
      required: [data, pagination]
    Doador:
      type: object
      properties:
        id_doador: { type: integer, example: 1 }
        nome: { type: string, maxLength: 150, example: Ana Souza }
        email: { type: string, nullable: true, maxLength: 100, example: ana@example.com }
        telefone: { type: string, nullable: true, maxLength: 20, example: '11999999999' }
        data_cadastro: { type: string, format: date-time }
      required: [id_doador, nome, data_cadastro]
    NovoDoador:
      type: object
      properties:
        nome: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, nullable: true, maxLength: 100, format: email }
        telefone: { type: string, nullable: true, maxLength: 20 }
      required: [nome]
    ItemCatalogo:
      type: object
      properties:
        id_item: { type: integer }
        nome: { type: string }
        unidade: { type: string }
        id_categoria: { type: integer }
        categoria: { type: string }
      required: [id_item, nome, unidade, id_categoria, categoria]
    ItemDoacao:
      type: object
      properties:
        id_item: { type: integer, minimum: 1 }
        nome: { type: string }
        quantidade: { type: integer, minimum: 1 }
        unidade: { type: string }
      required: [id_item, nome, quantidade, unidade]
    DoadorResumo:
      type: object
      properties:
        id_doador: { type: integer }
        nome: { type: string }
      required: [id_doador, nome]
    DoacaoDetalhada:
      type: object
      properties:
        id_doacao: { type: integer }
        data_doacao: { type: string, format: date }
        observacao: { type: string, nullable: true }
        status: { type: string, enum: [registrada, recebida, distribuida, cancelada] }
        doador: { $ref: '#/components/schemas/DoadorResumo' }
        itens:
          type: array
          items: { $ref: '#/components/schemas/ItemDoacao' }
      required: [id_doacao, data_doacao, status, doador, itens]
    NovaDoacao:
      type: object
      properties:
        id_doador: { type: integer, minimum: 1 }
        data_doacao: { type: string, format: date, example: '2026-11-27' }
        observacao: { type: string, nullable: true, maxLength: 255 }
        itens:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id_item: { type: integer, minimum: 1 }
              quantidade: { type: integer, minimum: 1 }
            required: [id_item, quantidade]
      required: [id_doador, data_doacao, itens]
  responses:
    Proibido:
      description: Perfil sem permissão para a operação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoAutorizado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    RequisicaoInvalida:
      description: Dados inválidos, JSON malformado ou referência inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    ErroInterno:
      description: Erro interno do servidor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
