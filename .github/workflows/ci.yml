name: Verificação do projeto

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: maos_que_ajudam
      TEST_DATABASE: "1"
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar cliente MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar banco de testes
        run: |
          # A atividade exige que o schema possa ser executado mais de uma vez.
          mariadb --skip-ssl -h 127.0.0.1 -uroot -proot < database/schema.sql
          mariadb --skip-ssl -h 127.0.0.1 -uroot -proot < database/schema.sql
          # A migração deve funcionar tanto em bases antigas quanto no schema atual.
          mariadb --skip-ssl -h 127.0.0.1 -uroot -proot maos_que_ajudam < database/migrations/002_gestao_operacional.sql
          mariadb --skip-ssl -h 127.0.0.1 -uroot -proot maos_que_ajudam < database/migrations/002_gestao_operacional.sql
          mariadb --skip-ssl -h 127.0.0.1 -uroot -proot maos_que_ajudam < database/seed.sql
      - name: Preparar Vite+
        run: npm run prepare
      - name: Executar testes unitários e de integração
        run: npm test
      - name: Gerar build do frontend
        run: npm run build
