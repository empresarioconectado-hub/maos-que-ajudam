name: Verificação do projeto

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: maos_que_ajudam
      TEST_DATABASE: "1"
      AUTH_SECRET: "segredo-exclusivo-para-testes-com-mais-de-32-bytes"
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exportar lockfile resolvido para sincronização
        run: |
          echo LOCKFILE_BASE64_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_BASE64_END
      - name: Preparar banco de testes
        run: |
          DB_CONTAINER="$(docker ps -q --filter ancestor=mariadb:10.11 | head -n 1)"
          test -n "$DB_CONTAINER"
          # A atividade exige que o schema possa ser executado mais de uma vez.
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot < database/schema.sql
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot < database/schema.sql
          # Confirma a reexecução das migrações sem duplicar estruturas.
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot maos_que_ajudam < database/migrations/002_gestao_operacional.sql
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot maos_que_ajudam < database/migrations/002_gestao_operacional.sql
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot maos_que_ajudam < database/migrations/003_autenticacao.sql
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot maos_que_ajudam < database/migrations/003_autenticacao.sql
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot maos_que_ajudam < database/migrations/004_limite_minimo_estoque.sql
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot maos_que_ajudam < database/migrations/004_limite_minimo_estoque.sql
          docker exec -i "$DB_CONTAINER" mariadb -uroot -proot maos_que_ajudam < database/seed.sql
      - name: Preparar Vite+
        run: npm run prepare
      - name: Verificar sintaxe JavaScript
        run: find server scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Executar testes unitários e de integração
        run: npm test
      - name: Gerar build do frontend
        run: npm run build
